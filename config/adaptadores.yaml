minimum_free_disk_gb: 200
paths:
  projects: E:/05_PROJETOS/forja/projetos
  global_assets: E:/05_PROJETOS/forja/global
  comfyui: C:/ComfyUI
  benchmark_output: E:/05_PROJETOS/forja/benchmark_out
services:
  - name: ComfyUI
    url: http://127.0.0.1:8188/system_stats
    required: true
  - name: Ollama
    url: http://127.0.0.1:11434/api/tags
    required: true
  - name: 9Router
    url: http://127.0.0.1:20128/api/health
    required: true
python_environments:
  depthflow: envs/depthflow/Scripts/python.exe
  whisperx: envs/align/Scripts/python.exe
  realesrgan: envs/realesrgan/Scripts/python.exe
  kokoro: D:/IA/audio_factory/.venv/Scripts/python.exe
  rembg: D:/INSTALACOES/python/python.exe
alinhamento:
  modelo_asr: E:/05_PROJETOS/forja/modelos/whisper-large-v3-turbo-ct2
  modelo_alinhador: jonatasgrosman/wav2vec2-large-xlsr-53-portuguese
voicestudio:
  base_url: http://127.0.0.1:3900
  engine: omnivoice
  # Registre aqui apenas engines cuja licenca de saida comercial voce conferiu.
  # O inventario do app nao libera nenhuma engine para uso comercial.
  engines_comerciais: []
  instrucoes: ""
  timeout_seconds: 60
  probe_timeout_seconds: 3
llm:
  structured:
    provedor: openai_compat
    base_url: http://127.0.0.1:20128/v1
    modelo: default
  local:
    provedor: ollama
    base_url: http://127.0.0.1:11434
    modelo: qwen3:8b
  visao:
    provedor: ollama
    base_url: http://127.0.0.1:11434
    modelo: qwen2.5vl:7b
